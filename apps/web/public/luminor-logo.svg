<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Luminor icon</title>
  <desc id="desc">A muted gold four-pointed star with subtle diagonal rays inside a thin circular ring, on a transparent background.</desc>

  <defs>
    <linearGradient id="ringGold" x1="218" y1="226" x2="806" y2="798" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9a6c32"/>
      <stop offset="0.22" stop-color="#e5bd6b"/>
      <stop offset="0.42" stop-color="#fff0ae"/>
      <stop offset="0.64" stop-color="#bd8439"/>
      <stop offset="0.83" stop-color="#f0cf7f"/>
      <stop offset="1" stop-color="#8b5d29"/>
    </linearGradient>

    <linearGradient id="starGold" x1="342" y1="302" x2="705" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8d5c25"/>
      <stop offset="0.23" stop-color="#d9aa52"/>
      <stop offset="0.46" stop-color="#fff0a5"/>
      <stop offset="0.66" stop-color="#c18734"/>
      <stop offset="0.84" stop-color="#f0c66c"/>
      <stop offset="1" stop-color="#845322"/>
    </linearGradient>

    <linearGradient id="rayFadeNW" x1="464" y1="464" x2="327" y2="327" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f2cd7a" stop-opacity="0.50"/>
      <stop offset="0.45" stop-color="#c79445" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#9c6d32" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rayFadeNE" x1="560" y1="464" x2="697" y2="327" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f2cd7a" stop-opacity="0.50"/>
      <stop offset="0.45" stop-color="#c79445" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#9c6d32" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rayFadeSE" x1="560" y1="560" x2="697" y2="697" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f2cd7a" stop-opacity="0.50"/>
      <stop offset="0.45" stop-color="#c79445" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#9c6d32" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rayFadeSW" x1="464" y1="560" x2="327" y2="697" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f2cd7a" stop-opacity="0.50"/>
      <stop offset="0.45" stop-color="#c79445" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#9c6d32" stop-opacity="0"/>
    </linearGradient>

    <filter id="ringGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feFlood flood-color="#e6b85e" flood-opacity="0.20" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="starGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="11" result="blur"/>
      <feFlood flood-color="#efc76d" flood-opacity="0.28" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="starClip">
      <path d="M512 266
               C503 388 482 479 278 512
               C482 545 503 636 512 758
               C521 636 542 545 746 512
               C542 479 521 388 512 266Z"/>
    </clipPath>
  </defs>

  <g fill="none" stroke-linecap="round" stroke-width="2.2">
    <path d="M463 463 L323 323" stroke="url(#rayFadeNW)"/>
    <path d="M561 463 L701 323" stroke="url(#rayFadeNE)"/>
    <path d="M561 561 L701 701" stroke="url(#rayFadeSE)"/>
    <path d="M463 561 L323 701" stroke="url(#rayFadeSW)"/>
  </g>

  <circle cx="512" cy="512" r="292" fill="none" stroke="url(#ringGold)" stroke-width="5.5" filter="url(#ringGlow)"/>

  <path d="M512 266
           C503 388 482 479 278 512
           C482 545 503 636 512 758
           C521 636 542 545 746 512
           C542 479 521 388 512 266Z"
        fill="url(#starGold)" filter="url(#starGlow)"/>

  <g clip-path="url(#starClip)" pointer-events="none">
    <rect x="512" y="240" width="260" height="544" fill="#fff4bd" opacity="0.10"/>
    <rect x="252" y="512" width="520" height="272" fill="#3f260d" opacity="0.10"/>
    <path d="M512 266 V758" stroke="#fff5c6" stroke-opacity="0.16" stroke-width="1.2"/>
    <path d="M278 512 H746" stroke="#51300f" stroke-opacity="0.16" stroke-width="1.2"/>
  </g>
</svg>
